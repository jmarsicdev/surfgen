[project]
name = "surfgen"
version = "0.1.0"
description = "Benchmark: regenerating surfaces from ISO 25178-2 parameters"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "h5py", "scikit-image", "matplotlib", "openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
